{% extends "base.html" %}
{% block title %}Giriş — Blog{% endblock %}

{% block content %}
<div class="card narrow">
    <h1>Giriş Yap</h1>

    <form action="{{ url_for('login') }}" method="POST">
        <div class="field">
            <label for="email">E-posta</label>
            <input type="email" id="email" name="email" placeholder="ornek@gmail.com" required>
        </div>

        <div class="field">
            <label for="password">Şifre</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit">Giriş Yap</button>

        <p class="form-foot">
            Hesabın yok mu? <a href="{{ url_for('register') }}">Hemen kaydol</a>
        </p>
    </form>
</div>
{% endblock %}

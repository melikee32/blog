{% extends "base.html" %}
{% block title %}Profil —  Blog{% endblock %}

{% block content %}
<div class="card narrow">
    <h1>Profil</h1>

    <form action="{{ url_for('profile') }}" method="POST" enctype="multipart/form-data">
        <div class="field">
            <label>Fotoğraf</label>
            {% if user.photo %}
                <img src="{{ url_for('static', filename='uploads/' ~ user.photo) }}" alt="Profil fotoğrafı" style="max-width: 120px; display: block; margin-bottom: 0.5rem;">
            {% endif %}
            <input type="file" id="photo" name="photo" accept="image/*">
        </div>

        <div class="field">
            <label for="username">Kullanıcı adı</label>
            <input type="text" id="username" name="username" value="{{ session.username }}" maxlength="50" required>
        </div>

        <div class="field">
            <label for="email">E-posta</label>
            <input type="email" id="email" name="email" value="{{ session.email }}" maxlength="100" required>
        </div>

        <div class="field">
            <label for="new_password">Yeni şifre <span style="font-weight:400">(değiştirmek istemiyorsan boş bırak)</span></label>
            <input type="password" id="new_password" name="new_password">
        </div>

        <div class="field">
            <label for="password_hash">Mevcut şifre <span style="font-weight:400">(onay için)</span></label>
            <input type="password" id="password_hash" name="password_hash" required>
        </div>

        <button type="submit">Kaydet</button>
    </form>
</div>
{% endblock %}

{% extends "base.html" %} {% block title %}Kaydol —  Blog {% endblock %} {%
block content %}
<div class="card narrow">
  <h1>Hesap Oluştur</h1>

  <form action="{{ url_for('register') }}" method="POST">
    <div class="field">
      <label for="username">Kullanıcı adı</label>
      <input
        type="text"
        id="username"
        name="username"
        maxlength="50"
        required
      />
    </div>

    <div class="field">
      <label for="email">E-posta</label>
      <input type="email" id="email" name="email" maxlength="100" required />
    </div>

    <div class="field">
      <label for="password">Şifre</label>
      <input type="password" id="password" name="password" required />
    </div>

    <div class="field">
      <label for="job">Meslek</label>
      <select id="job" name="job" required>
        <option value="" selected disabled>Seçiniz...</option>
        <option value="Öğrenci">Öğrenci</option>
        <option value="Öğretmen">Öğretmen</option>
        <option value="Yazar">Yazar</option>
        <option value="Gazeteci">Gazeteci</option>
        <option value="Araştırmacı">Araştırmacı</option>
        <option value="Girişimci">Girişimci</option>
        <option value="Sanatçı">Sanatçı</option>
        <option value="Diğer">Diğer</option>
      </select>
    </div>

    <button type="submit">Kaydol</button>

    <p class="form-foot">
      Zaten hesabın var mı? <a href="{{ url_for('login') }}">Giriş yap</a>
    </p>
  </form>
</div>
{% endblock %}
